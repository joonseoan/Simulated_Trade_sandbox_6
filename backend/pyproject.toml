[project]
name = "simulated-trading-backend"
version = "0.1.0"
description = "FastAPI backend for Simulated Trading — AI trading workstation"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.uv]
package = false
