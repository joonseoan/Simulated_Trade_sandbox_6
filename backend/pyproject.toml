[project]
name = "simulated-trading-backend"
version = "0.1.0"
description = "Simulated Trading backend — market data package (unified provider interface, GBM simulator, Massive client)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
dev-dependencies = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-httpx>=0.30,<1",
]
