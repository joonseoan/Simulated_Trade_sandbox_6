name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

          # Optional: expanded allowed_tools snippet (commented out).
          # Once uncommented, this grants Claude permission to run git push,
          # create PRs via gh, and run uv/pytest/python3 commands directly,
          # instead of just leaving review comments for manual review.
          # NOTE: this file's action version uses the claude_args + --allowedTools
          # flag style (camelCase, CLI flag), not a separate top-level
          # `allowed_tools:` YAML key -- match the syntax already used above.
          # claude_args: >
          #   --allowedTools
          #   "mcp__github_inline_comment__create_inline_comment"
          #   "Bash(git push:*)"
          #   "Bash(gh pr create:*)"
          #   "Bash(uv sync:*)"
          #   "Bash(uv run pytest:*)"
          #   "Bash(python3:*)"
          #
          # Granting git push, gh pr create, and arbitrary python3 execution
          # lets Claude push and open PRs without human review in between --
          # be deliberate about when you flip this on.